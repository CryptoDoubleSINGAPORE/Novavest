<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="NovaVest — plataforma de activos digitales">
  <title>NovaVest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { 
      --bg: #f8fafc; 
      --panel: #ffffff; 
      --muted: #64748b; 
      --text: #0f172a; 
      --line: #e2e8f0; 
      --mint: #10b981; 
      --blue: #3b82f6; 
      --purple: #8b5cf6; 
      --fire: #ef4444; 
      --gold: #f59e0b; 
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background-color: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif; min-height: 100vh; padding-bottom: 92px; overflow-x: hidden; }
    
    button, input, select { font: inherit; }
    button { cursor: pointer; border: none; outline: none; }
    .hidden { display: none !important; }
    .app { max-width: 520px; margin: auto; padding: env(safe-area-inset-top) 17px 25px; position: relative; z-index: 1; }
    .view { display: none; }
    .view.active { display: block; animation: slideInBlur 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes slideInBlur { 0% { opacity: 0; transform: translateY(15px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .press-effect { transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s; }
    .press-effect:active { transform: scale(0.96); box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
    
    .top { display: flex; align-items: center; justify-content: space-between; padding: 17px 2px 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.5px; font-size: 21px; }
    .brandmark { width: 38px; height: 38px; display: grid; place-items: center; }
    .avatar { width: 39px; height: 39px; border-radius: 50%; background: linear-gradient(135deg, #0f172a, #334155); display: grid; place-items: center; font-weight: 800; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    .eyebrow { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 800; }
    .welcome { font-size: 24px; font-weight: 800; letter-spacing: -0.8px; margin: 5px 0 3px; }
    .sub { font-size: 13px; color: var(--muted); }
    
    .balance { margin-top: 19px; padding: 22px; border-radius: 24px; background: #0f172a; color: #fff; position: relative; overflow: hidden; box-shadow: 0 15px 35px rgba(15, 23, 42, 0.2); }
    .balance:before, .balance:after { content: ""; position: absolute; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 50%; width: 190px; height: 190px; right: -60px; top: -90px; }
    .balance:after { width: 130px; height: 130px; right: -20px; top: -60px; }
    .balance-head { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
    .balance .eyebrow { color: #94a3b8; }
    .pill { border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 7px 10px; font-size: 11px; color: #fff; font-weight: 600; }
    .amount { font-size: 38px; letter-spacing: -1.5px; font-weight: 800; margin: 17px 0 4px; position: relative; z-index: 1; }
    .change { font-size: 12px; color: var(--mint); position: relative; z-index: 1; font-weight: 600; }
    
    .balance-actions { display: flex; gap: 10px; margin-top: 20px; position: relative; z-index: 1; }
    .action { border-radius: 14px; padding: 12px 16px; font-weight: 700; font-size: 13px; flex: 1; }
    .primary { background: #fff; color: #0f172a; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); }
    .ghost { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); }
    
    .section { display: flex; justify-content: space-between; align-items: center; margin: 25px 2px 12px; }
    .section h2 { font-size: 17px; margin: 0; font-weight: 800; }
    
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .stat { padding: 18px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
    .stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; font-weight: 600; }
    .stat strong { display: block; font-size: 20px; margin-top: 12px; font-weight: 800; color: #0f172a; }
    .stat small { color: var(--mint); font-size: 11px; font-weight: 600; }
    
    .active-inv-card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.04); }
    .active-inv-info b { display: block; font-size: 14px; color: #0f172a; margin-bottom: 4px; font-weight: 800; }
    .active-inv-info span { font-size: 12px; color: var(--muted); display: block; font-weight: 500; }
    .active-inv-timer { text-align: right; }
    .active-inv-timer strong { display: block; font-size: 18px; font-family: monospace; color: #0f172a; font-weight: 800; }
    .active-inv-timer span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;}
    .claim-btn { background: var(--mint); color: #fff; padding: 10px 15px; border-radius: 10px; font-weight: 800; font-size: 13px; animation: pulse 2s infinite; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    
    .plans { display: grid; gap: 15px; margin-top: 10px; }
    .plan-card { padding: 22px; border-radius: 24px; background: var(--panel); position: relative; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.03); transition: transform 0.2s; }
    .plan-card:active { transform: scale(0.98); }
    
    .plan-card.cold-theme { border-top: 4px solid var(--blue); }
    .plan-card.cold-theme .plan-title { color: var(--blue); }
    .plan-card.cold-theme .plan-btn { background: var(--blue); color: #fff; }
    
    .plan-card.fire-theme { border-top: 4px solid var(--fire); }
    .plan-card.fire-theme .plan-title { color: var(--fire); }
    .plan-card.fire-theme .plan-btn { background: var(--fire); color: #fff; }
    
    .plan-badge { position: absolute; top: 0; right: 0; background: var(--fire); color: #fff; font-size: 10px; font-weight: 800; padding: 6px 12px; border-bottom-left-radius: 12px; }
    .plan-title { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
    .plan-yield { font-size: 28px; font-weight: 800; margin-bottom: 5px; color: #0f172a; }
    .plan-desc { font-size: 12px; color: var(--muted); margin-bottom: 18px; font-weight: 500; }
    .plan-freq { font-size: 11px; font-weight: 700; margin-bottom: 15px; padding: 6px 10px; border-radius: 8px; display: inline-block; background: var(--bg); color: var(--text); }
    .plan-btn { width: 100%; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 13px; transition: 0.2s; }
    .plan-btn:active { transform: scale(0.96); opacity: 0.9; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; margin-top: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
    .field-label { display: block; font-size: 11px; color: var(--muted); margin: 14px 0 7px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .select, .number, .field { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 14px; outline: none; transition: 0.2s; font-weight: 600; }
    .select:focus, .number:focus, .field:focus { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
    .amount-wrap { position: relative; }
    .amount-wrap .number { padding-right: 70px; font-size: 18px; font-weight: 800; }
    .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); font-weight: 700; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 7px; font-weight: 500; }
    
    .wide { width: 100%; border-radius: 16px; padding: 16px; background: #0f172a; color: #fff; font-weight: 800; margin-top: 14px; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.2); }
    .wide:active { transform: scale(0.96); opacity: 0.9; }

    .info-box { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 15px; margin-top: 15px; }
    .info-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: var(--text); font-weight: 600; }
    .info-row:last-child { margin-bottom: 0; }
    .info-row b { color: var(--mint); }

    .coins { display: grid; gap: 9px; }
    .coin { display: flex; align-items: center; padding: 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); gap: 11px; }
    .coin-logo { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; padding: 4px; }
    .coin-logo img { width: 100%; height: 100%; object-fit: contain; }
    .coin-info { flex: 1; }
    .coin-info b { display: block; font-size: 14px; font-weight: 700; }
    .coin-info span { font-size: 11px; color: var(--muted); font-weight: 600; }
    .coin-value b { font-size: 13px; font-weight: 800; }

    .activity { display: grid; gap: 0; }
    .activity-item { display: flex; align-items: center; gap: 11px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .activity-item:last-child { border: 0; }
    .activity-icon { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); color: var(--text); }
    .activity-info { flex: 1; }
    .activity-info b { font-size: 13px; display: block; font-weight: 700; }
    .activity-info span { font-size: 11px; color: var(--muted); font-weight: 500; }
    .activity-amount { font-size: 13px; font-weight: 800; text-align: right; }

    .investor { display: flex; align-items: center; gap: 14px; }
    .investor-face { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: #0f172a; color: #fff; font-weight: 800; font-size: 18px; }
    .investor-info b { font-size: 16px; display: block; font-weight: 800; }
    .investor-info span { font-size: 12px; color: var(--muted); font-weight: 500; }

    .nav { position: fixed; z-index: 10; bottom: 0; left: 0; right: 0; padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--line); }
    .nav-inner { max-width: 520px; margin: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .nav button { background: transparent; color: var(--muted); padding: 8px 2px; border-radius: 14px; font-size: 10px; font-weight: 700; display: grid; justify-items: center; gap: 4px; transition: 0.2s; }
    .nav button span { font-size: 20px; }
    .nav button.active { color: #0f172a; background: var(--bg); }
    .nav button.active span { transform: translateY(-2px); }
    
    .toast { position: fixed; z-index: 30; bottom: 100px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 20; display: none; align-items: flex-end; justify-content: center; padding: 15px; backdrop-filter: blur(4px); }
    .modal-backdrop.open { display: flex; animation: fadeIn 0.2s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { width: 100%; max-width: 490px; background: var(--panel); border-radius: 28px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); max-height: 85vh; overflow-y: auto; animation: modalSlideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes modalSlideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    .modal h3 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
    .modal p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; font-weight: 500; }
    .close { float: right; background: var(--bg); border: 0; color: var(--text); border-radius: 50%; width: 32px; height: 32px; display: grid; place-items: center; font-weight: bold; }
    
    .modal-actions { display: flex; gap: 10px; }
    .modal-btn-cancel { flex: 1; background: var(--bg); border: none; color: var(--text); padding: 16px; border-radius: 14px; font-weight: 700; font-size: 14px; }
    .modal-btn-confirm { flex: 1; background: #0f172a; border: none; color: #fff; padding: 16px; border-radius: 14px; font-weight: 700; font-size: 14px; }

    .invest-coin-section { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 15px; }
    .invest-coin-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .invest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .invest-btn { background: var(--bg); border: 1px solid var(--line); padding: 14px; border-radius: 14px; color: var(--text); display: flex; flex-direction: column; align-items: flex-start; gap: 3px; transition: 0.2s; }
    .invest-btn:hover { border-color: #0f172a; }
    .invest-btn-price { font-weight: 800; font-size: 16px; }
    .invest-btn-price span { font-size: 10px; color: var(--muted); font-weight: 700; }
    .invest-btn-yield { font-size: 11px; font-weight: 700; }

    .auth-wrap { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 22px; }
    .auth-card { width: 100%; max-width: 430px; background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); }
    .auth-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; margin-bottom: 27px; }
    .auth-card h1 { font-size: 26px; margin: 0 0 7px; font-weight: 800; }
    .auth-sub { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 0 0 24px; font-weight: 500; }
    .auth-form { display: grid; gap: 10px; }
    .auth-btn { border-radius: 14px; padding: 16px; background: #0f172a; color: #fff; font-weight: 800; margin-top: 8px; }
    .auth-switch { color: var(--muted); font-size: 13px; text-align: center; margin-top: 20px; font-weight: 500; }
    .link-btn { color: #0f172a; background: none; font-weight: 800; }
    .auth-message { font-size: 13px; line-height: 1.5; color: #fff; background: #0f172a; border-radius: 12px; padding: 12px; margin: 12px 0; font-weight: 600; }
    .auth-error { color: #fff; background: var(--fire); }
    
    @media(min-width:600px) { 
      body { padding-top: 20px; } 
      .nav { position: sticky; bottom: 0; border-radius: 20px; margin: 0 auto 12px; max-width: 520px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.05); } 
      .modal-backdrop { align-items: center; } 
    }
  </style>
</head>
<body>
