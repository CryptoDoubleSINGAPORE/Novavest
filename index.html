<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>NovaVest | Gestión de Activos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { --bg: #f8fafc; --panel: #ffffff; --muted: #64748b; --text: #0f172a; --line: #e2e8f0; --mint: #10b981; --blue: #3b82f6; --fire: #ef4444; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background-color: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif; min-height: 100vh; padding-bottom: 92px; overflow-x: hidden; }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: none; outline: none; }
    .hidden { display: none !important; }
    
    .app { max-width: 520px; margin: auto; padding: 17px; position: relative; z-index: 1; }
    
    /* MENÚ BASE (Celular) */
    .nav { position: fixed; z-index: 10; bottom: 0; left: 0; right: 0; padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--line); }
    .nav-inner { max-width: 520px; margin: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .nav button { background: transparent; color: var(--muted); padding: 8px 2px; border-radius: 14px; font-size: 10px; font-weight: 700; display: grid; justify-items: center; gap: 4px; transition: 0.2s; }
    .nav button span { font-size: 20px; }
    .nav button.active { color: #0f172a; background: var(--bg); }
    
    /* VISTAS Y TARJETAS */
    .view { display: none; } .view.active { display: block; }
    .balance { margin-top: 19px; padding: 22px; border-radius: 24px; background: #0f172a; color: #fff; box-shadow: 0 15px 35px rgba(15, 23, 42, 0.2); }
    .amount { font-size: 38px; font-weight: 800; margin: 17px 0 4px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; margin-top: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }

    /* ========================================= */
    /* DISEÑO DE ESCRITORIO (PC) - SE ACTIVA EN 768px */
    /* ========================================= */
    @media (min-width: 768px) {
      body { 
        padding-bottom: 0; 
        background-color: #f1f5f9; 
      }

      /* Contenedor principal en 2 columnas */
      .app-layout {
        display: flex;
        min-height: 100vh;
      }

      /* Transformar menú en barra lateral */
      .nav { 
        position: sticky; 
        top: 0;
        left: 0;
        width: 250px;
        height: 100vh;
        border-top: none;
        border-right: 1px solid var(--line);
        padding: 30px 20px;
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }
      
      .nav-inner { 
        display: flex; 
        flex-direction: column; 
        gap: 10px; 
        width: 100%;
      }
      
      .nav button { 
        display: flex; 
        align-items: center; 
        justify-content: flex-start;
        gap: 15px; 
        padding: 15px 20px; 
        font-size: 15px; 
        border-radius: 12px;
        width: 100%;
      }
      
      .nav button span { font-size: 22px; }
      .nav button.active { background: #0f172a; color: #fff; }

      /* El contenido principal ocupa el resto */
      #dashboard { flex: 1; display: flex; justify-content: center; }
      .app { max-width: 850px; width: 100%; padding: 40px; margin: 0; }
      
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
      .amount { font-size: 48px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <section id="authScreen" class="app" style="display:flex; min-height:100vh; align-items:center; justify-content:center;">
    <div class="panel" style="width:100%; max-width:430px;">
      <h2 style="text-align:center; font-weight:800; font-size:24px; margin-bottom:20px;">NovaVest</h2>
      <form id="loginForm">
        <label style="font-size:11px; font-weight:bold; color:var(--muted);">CORREO</label>
        <input type="email" id="loginEmail" style="width:100%; padding:14px; margin:8px 0 15px; border-radius:12px; border:1px solid var(--line); background:var(--bg);" required>
        <label style="font-size:11px; font-weight:bold; color:var(--muted);">CONTRASEÑA</label>
        <input type="password" id="loginPassword" style="width:100%; padding:14px; margin:8px 0 15px; border-radius:12px; border:1px solid var(--line); background:var(--bg);" required>
        <button type="submit" style="width:100%; padding:16px; border-radius:12px; background:#0f172a; color:#fff; font-weight:bold;">Entrar</button>
      </form>
    </div>
  </section>

  <!-- APP PRINCIPAL -->
  <div id="dashboard" class="hidden">
    <div class="app-layout">
      
      <!-- BARRA LATERAL / MENÚ INFERIOR -->
      <nav class="nav">
        <div class="nav-inner" id="navInner">
          <button class="active" onclick="navigate('home', this)"><span>⌂</span>Inicio</button>
          <button onclick="navigate('deposit', this)"><span>⇧</span>Depositar</button>
          <button onclick="navigate('withdraw', this)"><span>↗</span>Retirar</button>
          <button onclick="navigate('referrals', this)"><span>👥</span>Referidos</button>
          <button onclick="navigate('profile', this)"><span>◉</span>Perfil</button>
        </div>
      </nav>

      <!-- CONTENIDO -->
      <main class="app">
        <div id="view-home" class="view active">
          <h2 style="font-size:24px; font-weight:800;">¡Hola, inversor! 👋</h2>
          <div class="balance">
            <div style="font-size:11px; color:#94a3b8; letter-spacing:1px;">BALANCE TOTAL ESTIMADO</div>
            <div class="amount">$135.40</div>
            <div style="color:var(--mint); font-size:12px; font-weight:bold;">↗ Rendimiento actual</div>
          </div>
          <div class="panel">
            <h3 style="margin-top:0;">Tu resumen</h3>
            <div class="stats">
              <div style="background:var(--bg); padding:15px; border-radius:12px;">
                <div style="font-size:11px; color:var(--muted);">Inversión activa</div>
                <div style="font-size:20px; font-weight:800;">$0.00</div>
              </div>
              <div style="background:var(--bg); padding:15px; border-radius:12px;">
                <div style="font-size:11px; color:var(--muted);">Ganancia acumulada</div>
                <div style="font-size:20px; font-weight:800;">$0.00</div>
              </div>
            </div>
          </div>
        </div>
        
        <div id="view-deposit" class="view"><div class="panel"><h2>Depositar Fondos</h2></div></div>
        <div id="view-withdraw" class="view"><div class="panel"><h2>Retirar Ganancias</h2></div></div>
        <div id="view-referrals" class="view"><div class="panel"><h2>Programa de Referidos</h2></div></div>
        <div id="view-profile" class="view"><div class="panel"><h2>Perfil de inversor</h2></div></div>
      </main>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wuanvwxjvpnvlwioorrj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_XOEu8hqTQ7u03Uh9A08HdQ_O4z086C9';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    function navigate(viewName, btnElement) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + viewName).classList.add('active');
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      });
    });

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
      } else {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
